name: Build & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v5
      - name: Seed data from the deployed site (fallback if a refresh below fails)
        run: node scripts/seed-data.mjs "${{ steps.pages.outputs.base_url }}"
        continue-on-error: true
      - name: Refresh EUROCONTROL snapshot (keeps committed snapshot on failure)
        run: npm run fetch:eurocontrol
        continue-on-error: true
      - name: Refresh airborne-traffic snapshot (OpenSky, fallback adsb.lol)
        run: npm run fetch:sky
        continue-on-error: true
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
      - name: Unit tests
        if: github.event_name != 'schedule'
        run: npm test
      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
